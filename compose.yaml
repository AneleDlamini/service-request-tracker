services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d requests"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: